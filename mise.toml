min_version = "2026.6.14"

[settings]
task.run_auto_install = false

[tools]
colima = "0.10.3"
gh = "2.95.0"
node = "24.18.0"
codex = "latest"
pnpm = "11.9.0"

[tasks.default]
description = "Run the default project quality gate"
depends = ["check"]

[tasks.setup]
description = "Prepare repository hooks and pnpm workspace dependencies"
depends = ["hooks:install", "install"]

[tasks.install]
description = "Install pnpm workspace dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

[tasks."hooks:install"]
description = "Configure Git to use the repository's tracked hooks"
run = "scripts/install-git-hooks"

[tasks."setup:update-lockfile"]
description = "Update pnpm-lock.yaml after dependency changes"
run = "pnpm install --lockfile-only"

[tasks."format:check"]
description = "Check repository formatting"
run = "pnpm run format:check"

[tasks.format]
description = "Format repository files"
run = "pnpm run format"

[tasks.lint]
description = "Run ESLint"
run = "pnpm run lint"

[tasks.typecheck]
description = "Run strict TypeScript type checking"
run = "pnpm run typecheck"

[tasks.test]
description = "Run unit tests"
run = "pnpm run test"

[tasks."test:e2e"]
description = "Run e2e tests"
run = "pnpm run test:e2e"

[tasks.build]
description = "Build TypeScript outputs"
run = "pnpm run build"

[tasks."benchmark:openai-agents"]
description = "Run the OpenAI Agents benchmark CLI"
depends = ["build"]
run = "node packages/migaki-openai-agents-js/dist/cli.js"

[tasks."migaki:latest"]
description = "Print the newest local Migaki execution report"
run = "scripts/migaki-latest-report"

[tasks."migaki:advise"]
description = "Print next-session advice from the newest local Migaki execution graph"
run = "scripts/migaki-advise"

[tasks."migaki:codex"]
description = "Run codex exec with latest Migaki session advice prepended"
depends = ["build"]
run = "scripts/migaki-codex"

[tasks."migaki:doctor"]
description = "Inspect local Migaki Codex dogfooding health"
run = "scripts/migaki-doctor"

[tasks."migaki:dogfood"]
description = "Run the Codex dogfooding gate"
run = "scripts/migaki-dogfood"

[tasks."migaki:mvp-repo-agent-gate"]
description = "Run the MVP repo-agent completion gate"
depends = ["build"]
run = "scripts/migaki-mvp-repo-agent-gate"

[tasks."migaki:ready"]
description = "Check whether Migaki is usable in the current session"
run = "scripts/migaki-ready"

[tasks."migaki:hook-probe"]
description = "Run a fast deterministic native Codex hook probe"
run = "scripts/migaki-hook-probe"

[tasks."migaki:exec"]
description = "Run a command while recording redacted Migaki command evidence"
run = "scripts/migaki-exec"

[tasks."migaki:bridge"]
description = "Run a command through the default Codex app bridge evidence run"
run = "scripts/migaki-bridge"

[tasks."migaki:bridge-session"]
description = "Print a scoped Codex app bridge session run id and commands"
run = "scripts/migaki-bridge-session"

[tasks."migaki:finish"]
description = "Mark a running Migaki Codex turn complete"
run = "scripts/migaki-finish"

[tasks."migaki:runs"]
description = "List recent local Migaki execution reports"
run = "scripts/migaki-runs"

[tasks."migaki:promote"]
description = "Promote a local Migaki run into tracked project artifacts"
depends = ["build"]
run = "scripts/migaki-promote"

[tasks."migaki:smoke"]
description = "Run a trusted Codex hook smoke test and print the newest report"
depends = ["build"]
run = "scripts/migaki-smoke"

[tasks."migaki:feature-smoke"]
description = "Run the deterministic RAG feature smoke"
run = "scripts/migaki-feature-smoke"

[tasks."migaki:provider-smoke"]
description = "Run the deterministic RAG provider lowering smoke"
run = "scripts/migaki-provider-smoke"

[tasks."bootstrap:check"]
description = "Validate bootstrap script syntax and shell launch paths"
run = '''
#!/usr/bin/env sh
set -eu

sh -n scripts/env
sh -n scripts/bootstrap
sh -n scripts/install-git-hooks
sh -n scripts/migaki-advise
sh -n scripts/migaki-bridge
sh -n scripts/migaki-codex
sh -n scripts/migaki-doctor
sh -n scripts/migaki-dogfood
sh -n scripts/migaki-exec
sh -n scripts/migaki-finish
sh -n scripts/migaki-hook-probe
sh -n scripts/migaki-latest-report
sh -n scripts/migaki-mvp-repo-agent-gate
sh -n scripts/migaki-promote
sh -n scripts/migaki-ready
sh -n scripts/migaki-runs
sh -n scripts/migaki-feature-smoke
sh -n scripts/migaki-provider-smoke
sh -n scripts/migaki-smoke
sh -n scripts/run-git-hook-check
sh -n .githooks/pre-commit
sh -n .githooks/pre-push
scripts/bootstrap --help >/dev/null
scripts/migaki-advise --help >/dev/null
scripts/migaki-bridge --help >/dev/null
scripts/migaki-codex --help >/dev/null
scripts/migaki-doctor --help >/dev/null
scripts/migaki-dogfood --help >/dev/null
scripts/migaki-exec --help >/dev/null
scripts/migaki-finish --help >/dev/null
scripts/migaki-hook-probe --help >/dev/null
scripts/migaki-latest-report --help >/dev/null
scripts/migaki-mvp-repo-agent-gate --help >/dev/null
scripts/migaki-promote --help >/dev/null
scripts/migaki-ready --help >/dev/null
scripts/migaki-runs --help >/dev/null
scripts/migaki-feature-smoke --help >/dev/null
scripts/migaki-provider-smoke --help >/dev/null
scripts/migaki-smoke --help >/dev/null
scripts/bootstrap '-?' >/dev/null

if command -v bash >/dev/null 2>&1; then
  bash scripts/bootstrap --help >/dev/null
fi

if command -v zsh >/dev/null 2>&1; then
  zsh scripts/bootstrap --help >/dev/null
fi

if command -v fish >/dev/null 2>&1; then
  fish -c 'scripts/bootstrap --help >/dev/null'
fi

if command -v nu >/dev/null 2>&1; then
  nu -c 'scripts/bootstrap --help | ignore'
fi
'''

[tasks.check]
description = "Run the repository quality gate"
depends = ["install"]
run = "mise run check:tasks"

[tasks."check:tasks"]
description = "Run repository quality tasks after dependencies are installed"
depends = [
  "format:check",
  "lint",
  "typecheck",
  "test",
  "test:e2e",
  "build",
  "bootstrap:check",
]
