min_version = "2026.6.14"

[settings]
task.run_auto_install = false

[tools]
colima = "0.10.3"
gh = "2.95.0"
node = "24.18.0"
codex = "latest"
pnpm = "11.9.0"

[tasks.default]
description = "Run the default project quality gate"
depends = ["check"]

[tasks.setup]
description = "Install pnpm workspace dependencies from the lockfile"
depends = ["hooks:install"]
run = "pnpm install --frozen-lockfile"

[tasks."hooks:install"]
description = "Configure Git to use the repository's tracked hooks"
run = "scripts/install-git-hooks"

[tasks."setup:update-lockfile"]
description = "Update pnpm-lock.yaml after dependency changes"
run = "pnpm install --lockfile-only"

[tasks."format:check"]
description = "Check repository formatting"
run = "pnpm run format:check"

[tasks.lint]
description = "Run ESLint"
run = "pnpm run lint"

[tasks.typecheck]
description = "Run strict TypeScript type checking"
run = "pnpm run typecheck"

[tasks.test]
description = "Run unit tests"
run = "pnpm run test"

[tasks."test:e2e"]
description = "Run e2e tests"
run = "pnpm run test:e2e"

[tasks.build]
description = "Build TypeScript outputs"
run = "pnpm run build"

[tasks."benchmark:openai-agents"]
description = "Run the OpenAI Agents benchmark CLI"
depends = ["build"]
run = "node packages/migaki-openai-agents-js/dist/cli.js"

[tasks."migaki:latest"]
description = "Print the newest local Migaki execution report"
run = "scripts/migaki-latest-report"

[tasks."migaki:runs"]
description = "List recent local Migaki execution reports"
run = "scripts/migaki-runs"

[tasks."migaki:smoke"]
description = "Run a trusted Codex hook smoke test and print the newest report"
depends = ["build"]
run = "scripts/migaki-smoke"

[tasks."migaki:feature-smoke"]
description = "Run the deterministic RAG feature smoke"
run = "scripts/migaki-feature-smoke"

[tasks."bootstrap:check"]
description = "Validate bootstrap script syntax and shell launch paths"
run = '''
#!/usr/bin/env sh
set -eu

sh -n scripts/env
sh -n scripts/bootstrap
sh -n scripts/install-git-hooks
sh -n scripts/migaki-latest-report
sh -n scripts/migaki-runs
sh -n scripts/migaki-feature-smoke
sh -n scripts/migaki-smoke
sh -n scripts/run-git-hook-check
sh -n .githooks/pre-commit
sh -n .githooks/pre-push
scripts/bootstrap --help >/dev/null
scripts/migaki-latest-report --help >/dev/null
scripts/migaki-runs --help >/dev/null
scripts/migaki-feature-smoke --help >/dev/null
scripts/migaki-smoke --help >/dev/null
scripts/bootstrap '-?' >/dev/null

if command -v bash >/dev/null 2>&1; then
  bash scripts/bootstrap --help >/dev/null
fi

if command -v zsh >/dev/null 2>&1; then
  zsh scripts/bootstrap --help >/dev/null
fi

if command -v fish >/dev/null 2>&1; then
  fish -c 'scripts/bootstrap --help >/dev/null'
fi

if command -v nu >/dev/null 2>&1; then
  nu -c 'scripts/bootstrap --help | ignore'
fi
'''

[tasks.check]
description = "Run the repository quality gate"
depends = [
  "format:check",
  "lint",
  "typecheck",
  "test",
  "test:e2e",
  "build",
  "bootstrap:check",
]
